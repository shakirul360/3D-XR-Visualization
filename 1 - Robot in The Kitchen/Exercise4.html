<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Exercise 2 - Robot</title>
    <style>
      html,
      body {
        width: 50%;
        height: 50%;
        margin: 0;
      }

      #c {
        width: 50%;
        height: 50%;
        display: block;
      }
    </style>
  </head>
  <body>
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
      }
    }
  </script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
  import { createKitchen } from './functions.js';
  import {createRobot} from './functions.js';
  import { animateRobotJoints } from './functions.js';

      var scene = new THREE.Scene();
      var aspect = window.innerWidth / window.innerHeight;
      var camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
      var renderer = new THREE.WebGLRenderer();
      renderer.shadowMap.enabled= true;
      console.log(renderer.context);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls( camera, renderer.domElement );

    //   function render () {
    //     requestAnimationFrame(render);
    //     renderer.render(scene, camera);
    //   };
    
    const gui = new GUI();

    // White directional light at half intensity shining from the top.
        const light = new THREE.DirectionalLight(0xfffff1, 3 );
        light.position.set(15,-15,5);
        light.shadow.camera.near = 0.1;
        light.shadow.camera.far = 100;
        light.castShadow = true;
        scene.add( light );

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

    const spotLight = new THREE.SpotLight(0xfff1a8, 2);
    spotLight.position.set(-0.5, 2.5, 0.5); // above counter
    scene.add(spotLight); 

    const target = new THREE.Object3D();
    target.position.set(-0.5, 1.25, 0.25); // center of counter
    scene.add(target);

    spotLight.target = target;

    spotLight.castShadow = true;

    // Shadow quality
    spotLight.shadow.mapSize.width = 1024;
    spotLight.shadow.mapSize.height = 1024;

    // Reduce shadow acne
    spotLight.shadow.bias = -0.0001;

        light.castShadow = true;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;


        camera.position.z = 5; 

      const lightFolder = gui.addFolder('Directional Light');
        lightFolder.add(light, 'intensity', 0, 5);
        lightFolder.add(light.position, 'x', -20, 20);
        lightFolder.add(light.position, 'y', -20, 20);
        lightFolder.add(light.position, 'z', -20, 20);
      
      const ambientLightFolder = gui.addFolder('Ambient Light');
        ambientLightFolder.add(ambientLight, 'intensity', 0, 1);
    

      
    createKitchen(scene, renderer, camera,gui); //exercise 1
    const robot = createRobot(scene, renderer, camera, gui); //exercise 2

    

    const params = {
    // Left
    leftArmGroup: 0,
    leftShoulder: 0,
    leftArm: 0,
    leftElbow: 0,
    leftForeArm: 0,
    leftGripper: 0,

    // right
    rightArmGroup: 0,
    rightShoulder: 0,
    rightArm: 0,
    rightElbow: 0,
    rightForeArm: 0,
    rightGripper: 0,
  };

  const leftFolder = gui.addFolder('Left Arm');
  const rightFolder = gui.addFolder('Right Arm');

  leftFolder.add(params, 'leftArmGroup', -Math.PI, Math.PI)
  .name('Whole Arm')
  .onChange(v => robot.leftArmGroup.rotation.z = v);

  leftFolder.add(params, 'leftShoulder', -Math.PI, Math.PI)
    .onChange(v => robot.leftShoulder.rotation.z = v);

  leftFolder.add(params, 'leftArm', -Math.PI, Math.PI)
    .onChange(v => robot.leftArm.rotation.x = v);

  leftFolder.add(params, 'leftElbow', -Math.PI, Math.PI)
    .onChange(v => robot.leftElbow.rotation.z = v);

  leftFolder.add(params, 'leftForeArm', -Math.PI, Math.PI)
    .onChange(v => robot.leftforeArm.rotation.x = v);

  leftFolder.add(params, 'leftGripper', -Math.PI, Math.PI)
    .onChange(v => robot.leftGripper.rotation.z = v);

  

    rightFolder.add(params, 'rightArmGroup', -Math.PI, Math.PI)
  .name('Whole Arm')
  .onChange(v => robot.rightArmGroup.rotation.z = v);

  rightFolder.add(params, 'rightShoulder', -Math.PI, Math.PI)
    .onChange(v => robot.rightShoulder.rotation.z = v);

  rightFolder.add(params, 'rightArm', -Math.PI, Math.PI)
    .onChange(v => robot.rightArm.rotation.x = v);

  rightFolder.add(params, 'rightElbow', -Math.PI, Math.PI)
    .onChange(v => robot.rightElbow.rotation.z = v);

  rightFolder.add(params, 'rightForeArm', -Math.PI, Math.PI)
    .onChange(v => robot.rightforeArm.rotation.x = v);

  rightFolder.add(params, 'rightGripper', -Math.PI, Math.PI)
    .onChange(v => robot.rightGripper.rotation.z = v);
      


    function render() {
    requestAnimationFrame(render);

    animateRobotJoints(robot); // Calling the animation function to update joint angles

    controls.update(); // updating orbit controls
    renderer.render(scene, camera);
}


    
      camera.position.z = 5;

      render();
     
    </script>
  </body>
</html>
