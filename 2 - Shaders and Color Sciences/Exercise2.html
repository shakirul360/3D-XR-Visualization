<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; }
</style>
</head>
<body>
<div id="container"></div>

<script id="vertexShader" type="x-shader/x-vertex">
uniform sampler2D uTexture;
uniform float uHeightScale;
uniform float uChannel;
uniform float uColorSpace;

varying float vHeight;
varying vec2 vUv;
varying vec3 vColor;

const vec3 D65 = vec3(0.95047, 1.00000, 1.08883);
const float PI = 3.14159265358979323846;

vec3 rgb2hsv(vec3 c){
    float cmax = max(c.r, max(c.g, c.b));
    float cmin = min(c.r, min(c.g, c.b));
    float delta = cmax - cmin;

    float h = 0.0;
    if(delta > 0.0){
        if(cmax == c.r) h = mod(60.0 * ((c.g - c.b) / delta) + 360.0, 360.0);
        else if(cmax == c.g) h = 60.0 * ((c.b - c.r) / delta + 2.0);
        else h = 60.0 * ((c.r - c.g) / delta + 4.0);
    }

    float s = (cmax == 0.0) ? 0.0 : delta / cmax;
    float v = cmax;

    return vec3(h / 360.0, s, v);
}

vec3 srgbToLinear(vec3 c){
    vec3 lowPart = c / 12.92;
    vec3 highPart = pow((c + 0.055) / 1.055, vec3(2.4));
    vec3 useHigh = step(vec3(0.04045), c);
    return mix(lowPart, highPart, useHigh);
}

vec3 linearRgbToXyz(vec3 rgb){
    float X = 0.4124564 * rgb.r + 0.3575761 * rgb.g + 0.1804375 * rgb.b;
    float Y = 0.2126729 * rgb.r + 0.7151522 * rgb.g + 0.0721750 * rgb.b;
    float Z = 0.0193339 * rgb.r + 0.1191920 * rgb.g + 0.9503041 * rgb.b;
    return vec3(X, Y, Z);
}

vec3 xyzToXyy(vec3 xyz){
    float sum = xyz.x + xyz.y + xyz.z;
    if(sum == 0.0) return vec3(0.0);
    return vec3(xyz.x / sum, xyz.y / sum, xyz.y);
}

float lab_f(float t){
    float delta = 6.0 / 29.0;
    float delta3 = delta * delta * delta;
    if(t > delta3) return pow(t, 1.0 / 3.0);
    return t / (3.0 * delta * delta) + 4.0 / 29.0;
}

vec3 xyzToLab(vec3 xyz){
    float fx = lab_f(xyz.x / D65.x);
    float fy = lab_f(xyz.y / D65.y);
    float fz = lab_f(xyz.z / D65.z);

    float L = 116.0 * fy - 16.0;
    float a = 500.0 * (fx - fy);
    float b = 200.0 * (fy - fz);

    return vec3(L, a, b);
}

vec3 labToLch(vec3 lab){
    float C = sqrt(lab.y * lab.y + lab.z * lab.z);
    float h = atan(lab.z, lab.y);
    if(h < 0.0) h += 2.0 * PI;
    return vec3(lab.x, C, h);
}

float getHeightValue(vec3 color, float colorSpace, float channel) {
    vec3 hsv = rgb2hsv(color);
    vec3 linearRgb = srgbToLinear(color);
    vec3 xyz = linearRgbToXyz(linearRgb);
    vec3 xyy = xyzToXyy(xyz);
    vec3 lab = xyzToLab(xyz);
    vec3 lch = labToLch(lab);

    if (colorSpace < 0.5) {
        if (channel < 0.5) return color.r;
        else if (channel < 1.5) return color.g;
        else return color.b;
    }
    else if (colorSpace < 1.5) {
        if (channel < 0.5) return hsv.x;
        else if (channel < 1.5) return hsv.y;
        else return hsv.z;
    }
    else if (colorSpace < 2.5) {
        if (channel < 0.5) return clamp(xyz.x, 0.0, 1.0);
        else if (channel < 1.5) return clamp(xyz.y, 0.0, 1.0);
        else return clamp(xyz.z, 0.0, 1.0);
    }
    else if (colorSpace < 3.5) {
        if (channel < 0.5) return clamp(xyy.x, 0.0, 1.0);
        else if (channel < 1.5) return clamp(xyy.y, 0.0, 1.0);
        else return clamp(xyy.z, 0.0, 1.0);
    }
    else if (colorSpace < 4.5) {
        if (channel < 0.5) return clamp(lab.x / 100.0, 0.0, 1.0);
        else if (channel < 1.5) return clamp((lab.y + 128.0) / 255.0, 0.0, 1.0);
        else return clamp((lab.z + 128.0) / 255.0, 0.0, 1.0);
    }
    else {
        if (channel < 0.5) return clamp(lch.x / 100.0, 0.0, 1.0);
        else if (channel < 1.5) return clamp(lch.y / 150.0, 0.0, 1.0);
        else return clamp(lch.z / (2.0 * PI), 0.0, 1.0);
    }
}

void main() {
    vUv = uv;

    vec3 color = texture2D(uTexture, uv).rgb;
    vColor = color;

    float height = getHeightValue(color, uColorSpace, uChannel);
    vHeight = height;

    vec3 displaced = position;
    displaced.y += height * uHeightScale;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
}
</script>

<script id="fragmentShader" type="x-shader/x-fragment">
    varying vec3 vColor;

    void main() {
        gl_FragColor = vec4(vColor, 1.0);
    }
</script>

<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.18.1/dist/lil-gui.esm.min.js";

let container, scene, camera, renderer, controls;
let uniforms, mesh;

init();
animate();

function init() {
    container = document.getElementById("container");
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x666666);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 2, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x555555));

    renderer = new THREE.WebGLRenderer();
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(1.5, 1.2, 1.5);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.3, 0);
    controls.update();

    const loader = new THREE.TextureLoader();
    loader.load("summer.jpg", (texture) => {
        uniforms = {
            uTexture: { value: texture },
            uHeightScale: { value: 1.0 },
            uChannel: { value: 0 },
            uColorSpace: { value: 0 }
        };
        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: document.getElementById("vertexShader").textContent,
            fragmentShader: document.getElementById("fragmentShader").textContent,
            side: THREE.DoubleSide
        });

        const geometry = new THREE.PlaneGeometry(1, 1, 256, 256);
        geometry.rotateX(-Math.PI / 2);

        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
    });

    const gui = new GUI();

    const params = {
        HeightScale: 1.0,
        ColorSpace: "RGB",
        Channel: "R"
    };

    gui.add(params, "HeightScale", 0.0, 8.0).onChange(v => {
        if (uniforms) uniforms.uHeightScale.value = v;
    });

    let channelController;

    function setChannelValue(v) {
        if (!uniforms) return;

        if (v === "R" || v === "H" || v === "X" || v === "x" || v === "L*") {
            uniforms.uChannel.value = 0;
        } else if (v === "G" || v === "S" || v === "Y" || v === "y" || v === "a*" || v === "C*") {
            uniforms.uChannel.value = 1;
        } else {
            uniforms.uChannel.value = 2;
        }

        console.log(
            "CHANNEL changed ->", v,
            "uColorSpace =", uniforms?.uColorSpace.value,
            "uChannel =", uniforms?.uChannel.value
        );
    }

    function rebuildChannelController() {
        if (channelController) {
            channelController.destroy();
            channelController = null;
        }

        let optionsArray;
        let defaultValue;

        if (params.ColorSpace === "RGB") {
            optionsArray = ["R", "G", "B"];
            defaultValue = "R";
            if (uniforms) uniforms.uColorSpace.value = 0;
        } else if (params.ColorSpace === "HSV") {
            optionsArray = ["H", "S", "V"];
            defaultValue = "H";
            if (uniforms) uniforms.uColorSpace.value = 1;
        } else if (params.ColorSpace === "XYZ") {
            optionsArray = ["X", "Y", "Z"];
            defaultValue = "X";
            if (uniforms) uniforms.uColorSpace.value = 2;
        } else if (params.ColorSpace === "xyY") {
            optionsArray = ["x", "y", "Y"];
            defaultValue = "x";
            if (uniforms) uniforms.uColorSpace.value = 3;
        } else if (params.ColorSpace === "LAB") {
            optionsArray = ["L*", "a*", "b*"];
            defaultValue = "L*";
            if (uniforms) uniforms.uColorSpace.value = 4;
        } else {
            optionsArray = ["L*", "C*", "h"];
            defaultValue = "L*";
            if (uniforms) uniforms.uColorSpace.value = 5;
        }

        params.Channel = defaultValue;

        channelController = gui.add(params, "Channel", optionsArray).name("Channel");
        channelController.onChange(setChannelValue);

        setChannelValue(defaultValue);
}

    gui.add(params, "ColorSpace", ["RGB", "HSV", "XYZ", "xyY", "LAB", "LCH"]).onChange(() => {
        rebuildChannelController();

        console.log("COLORSPACE changed ->", params.ColorSpace,
            "uColorSpace =", uniforms?.uColorSpace.value,
            "uChannel =", uniforms?.uChannel.value);
    });

    // create the correct initial dropdown
    rebuildChannelController();

}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
